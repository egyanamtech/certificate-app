version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: certificate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-certificate_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  certificate-app:
    build: .
    container_name: certificate-app
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_PRIVATE_KEY=${ADMIN_PRIVATE_KEY:-}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL:-https://ethereum-sepolia.publicnode.com}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS:-}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-postgres}
      - DB_NAME=${DB_NAME:-certificate_app}

volumes:
  postgres-data: